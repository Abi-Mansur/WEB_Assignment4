<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Web Assignment 4</title>
</head>
<body>
    <nav>
        <div class="logo">Assignment 4</div>
        <ul>
            <li><a href="../index.html">Task 1</a></li>
            <li><a href="Task2.html">Task 2</a></li>
            <li><a href="../Task3/Task3.html">Task 3</a></li>

        </ul>

    <div class="container ">
        <h1 style="color: rgb(1, 119, 70); font-weight: bold;">Task 2</h1>
        <form>
            <div class="row g-3">
                <div class="col-md-12">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Your first name">
                </div>
                <div class="col-md-12">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" placeholder="Your last name">
                </div>

                <div class="col-12">
                    <label for="emailInput" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
                    <div id="emailHelp" class="form-text">write correct email</div>
                </div>

                <div class="col-12">
                    <label for="messageTextarea" class="form-label">Message</label>
                    <textarea class="form-control" id="messageTextarea" rows="4" placeholder="Privet zaya, spish'?"></textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </div>
        </form>
    </div>
